<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZF ARCADE | PLAY</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --purple: #9147ff;
    --purple2: #6525d9;
    --bg: #090711;
    --card: #151222;
    --text: #fff;
    --muted: #aaa2bd;
    --green: #35e6a0;
    --red: #ff526d;
}

body {
    font-family: 'Cairo', sans-serif;
    background:
        radial-gradient(circle at 20% 10%, #32145b55, transparent 35%),
        radial-gradient(circle at 90% 80%, #4a168b33, transparent 35%),
        var(--bg);
    color: var(--text);
    min-height: 100vh;
}

button {
    font-family: inherit;
    cursor: pointer;
    border: none;
}

header {
    height: 75px;
    padding: 0 7%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #ffffff12;
    background: #0c0915cc;
    backdrop-filter: blur(15px);
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    color: white;
}

.logo span {
    color: var(--purple);
}

.back {
    background: #ffffff12;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
    transition: .3s;
}

.back:hover {
    background: var(--purple);
    transform: translateY(-3px);
}

.container {
    width: 90%;
    max-width: 950px;
    margin: 45px auto;
}

.top {
    text-align: center;
    margin-bottom: 30px;
}

.badge {
    display: inline-block;
    background: #9147ff22;
    color: #c8a7ff;
    padding: 7px 18px;
    border-radius: 30px;
    font-size: 13px;
    margin-bottom: 15px;
}

h1 {
    font-size: clamp(27px, 5vw, 42px);
    font-weight: 900;
}

.description {
    color: var(--muted);
    margin-top: 8px;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 25px 0;
    flex-wrap: wrap;
}

.stat {
    background: var(--card);
    border: 1px solid #ffffff12;
    padding: 12px 25px;
    border-radius: 15px;
    min-width: 120px;
    text-align: center;
}

.stat small {
    color: var(--muted);
    display: block;
}

.stat strong {
    font-size: 21px;
    color: #c59cff;
}

.game-box {
    background: linear-gradient(145deg, #191429, #100d19);
    border: 1px solid #ffffff16;
    border-radius: 25px;
    padding: 30px;
    min-height: 300px;
    box-shadow: 0 20px 70px #0005;
    animation: appear .5s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

.game-title {
    font-size: 23px;
    font-weight: 900;
    margin-bottom: 20px;
    text-align: center;
}

.question {
    font-size: 20px;
    text-align: center;
    margin: 25px 0;
    font-weight: 800;
}

.answers {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 13px;
}

.answer {
    background: #ffffff0b;
    border: 1px solid #ffffff16;
    color: white;
    padding: 16px;
    border-radius: 13px;
    font-size: 16px;
    transition: .2s;
}

.answer:hover {
    background: #9147ff33;
    border-color: var(--purple);
    transform: translateY(-3px);
}

.answer.correct {
    background: #20c77b33;
    border-color: var(--green);
}

.answer.wrong {
    background: #ff526d33;
    border-color: var(--red);
}

.main-btn {
    background: linear-gradient(135deg, #a45aff, #6525d9);
    color: white;
    padding: 13px 30px;
    border-radius: 13px;
    font-size: 16px;
    font-weight: 800;
    transition: .3s;
    margin: 10px 5px;
}

.main-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px #9147ff55;
}

.center {
    text-align: center;
}

input {
    width: 100%;
    max-width: 350px;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #ffffff22;
    background: #ffffff0b;
    color: white;
    font-family: inherit;
    font-size: 17px;
    outline: none;
    text-align: center;
    margin: 10px 0;
}

input:focus {
    border-color: var(--purple);
}

.message {
    text-align: center;
    margin: 20px 0;
    font-weight: 800;
    min-height: 30px;
}

.progress {
    height: 8px;
    background: #ffffff12;
    border-radius: 20px;
    overflow: hidden;
    margin: 20px 0;
}

.progress div {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6525d9, #c18aff);
    transition: .3s;
}

.memory-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    max-width: 500px;
    margin: auto;
}

.memory-card {
    min-height: 85px;
    border-radius: 14px;
    background: #261a3b;
    color: white;
    font-size: 28px;
    border: 1px solid #ffffff15;
    transition: .2s;
}

.memory-card:hover {
    background: #46216e;
}

.memory-card.opened,
.memory-card.matched {
    background: #9147ff44;
    border-color: var(--purple);
}

.xo-board {
    display: grid;
    grid-template-columns: repeat(3, 90px);
    justify-content: center;
    gap: 10px;
}

.xo-cell {
    height: 90px;
    background: #ffffff0c;
    border: 1px solid #ffffff18;
    color: white;
    border-radius: 15px;
    font-size: 35px;
    font-weight: 900;
}

.xo-cell:hover {
    background: #9147ff33;
}

.hidden {
    display: none !important;
}

footer {
    text-align: center;
    color: #777087;
    padding: 30px 10px;
    border-top: 1px solid #ffffff10;
    margin-top: 60px;
    font-size: 13px;
}

@media(max-width:600px) {
    header { padding: 0 5%; }
    .container { width: 94%; margin-top: 25px; }
    .game-box { padding: 20px 14px; }
    .answers { grid-template-columns: 1fr; }
    .memory-card { min-height: 65px; }
    .xo-board { grid-template-columns: repeat(3, 75px); }
    .xo-cell { height: 75px; }
}
</style>
</head>

<body>

<header>
    <div class="logo">AZF <span>ARCADE</span></div>
    <button class="back" onclick="location.href='games.html'">← رجوع للألعاب</button>
</header>

<div class="container">

    <div class="top">
        <span class="badge">🎮 AZF GAMING CENTER</span>
        <h1 id="pageTitle">مرحباً بك في الألعاب</h1>
        <p class="description" id="pageDescription">استعد للتحدي وارفع نقاطك!</p>
    </div>

    <div class="stats">
        <div class="stat">
            <small>⭐ نقاطك</small>
            <strong id="score">0</strong>
        </div>
        <div class="stat">
            <small>🎯 المستوى</small>
            <strong id="level">1</strong>
        </div>
    </div>

    <div class="game-box" id="gameArea">
        <div class="center">
            <h2>🎮 جاري تجهيز اللعبة...</h2>
        </div>
    </div>

</div>

<footer>
    جميع الحقوق محفوظة © أبو عزوز | AZF OFFICIAL
</footer>

<script>
const params = new URLSearchParams(location.search);
const game = params.get("game") || "quiz";

const username = sessionStorage.getItem("azf_current_user") || "guest";
const pointsKey = "azf_arcade_points_" + username;

let score = Number(localStorage.getItem(pointsKey)) || 0;
let level = Math.floor(score / 100) + 1;

const area = document.getElementById("gameArea");

function updateStats() {
    document.getElementById("score").textContent = score;
    level = Math.floor(score / 100) + 1;
    document.getElementById("level").textContent = level;
    localStorage.setItem(pointsKey, score);
}

function addPoints(amount) {
    score += amount;
    updateStats();
}

function setup(title, description) {
    document.getElementById("pageTitle").textContent = title;
    document.getElementById("pageDescription").textContent = description;
    updateStats();
}

function finish(message) {
    area.innerHTML = `
        <div class="center">
            <h2>🏆 انتهى التحدي!</h2>
            <p class="question">${message}</p>
            <p>نقاطك الحالية: <strong>${score}</strong></p>
            <button class="main-btn" onclick="location.reload()">العب مرة أخرى</button>
            <button class="main-btn" onclick="location.href='games.html'">قائمة الألعاب</button>
        </div>
    `;
}

/* 1 - تحدي الذكاء */

function quizGame() {
    setup("🧠 تحدي الذكاء", "اختبر معلوماتك واجمع أكبر عدد من النقاط.");

    const questions = [
        ["ما عاصمة المملكة العربية السعودية؟", ["جدة", "الرياض", "مكة", "الدمام"], 1],
        ["كم عدد أيام السنة العادية؟", ["360", "365", "366", "300"], 1],
        ["ما أكبر كوكب في المجموعة الشمسية؟", ["الأرض", "المريخ", "المشتري", "زحل"], 2],
        ["كم عدد ألوان قوس قزح؟", ["5", "6", "7", "8"], 2],
        ["ما الحيوان المعروف بسفينة الصحراء؟", ["الحصان", "الجمل", "الأسد", "الفيل"], 1],
        ["ما عاصمة اليابان؟", ["طوكيو", "سيول", "بكين", "بانكوك"], 0],
        ["كم يساوي 9 × 8؟", ["64", "72", "81", "90"], 1],
        ["ما أسرع حيوان بري؟", ["الأسد", "الفهد", "النمر", "الغزال"], 1],
        ["ما الكوكب الأحمر؟", ["الزهرة", "المريخ", "عطارد", "نبتون"], 1],
        ["كم عدد حروف اللغة العربية؟", ["26", "28", "30", "32"], 1]
    ];

    let index = 0;
    let correct = 0;

    function show() {
        if (index >= questions.length) {
            addPoints(correct * 10);
            finish(`أجبت بشكل صحيح على ${correct} من ${questions.length} أسئلة!`);
            return;
        }

        const q = questions[index];

        area.innerHTML = `
            <div class="game-title">السؤال ${index + 1} من ${questions.length}</div>
            <div class="progress"><div style="width:${index / questions.length * 100}%"></div></div>
            <div class="question">${q[0]}</div>
            <div class="answers">
                ${q[1].map((a, i) => `<button class="answer" onclick="answerQuiz(${i})">${a}</button>`).join("")}
            </div>
            <div class="message" id="msg"></div>
        `;
    }

    window.answerQuiz = function(choice) {
        const q = questions[index];
        const buttons = document.querySelectorAll(".answer");
        buttons.forEach((b, i) => {
            b.disabled = true;
            if (i === q[2]) b.classList.add("correct");
            if (i === choice && choice !== q[2]) b.classList.add("wrong");
        });

        if (choice === q[2]) {
            correct++;
            document.getElementById("msg").textContent = "✅ إجابة صحيحة!";
        } else {
            document.getElementById("msg").textContent = "❌ إجابة خاطئة!";
        }

        setTimeout(() => {
            index++;
            show();
        }, 900);
    };

    show();
}

/* 2 - سرعة البديهة */

function speedGame() {
    setup("⚡ سرعة البديهة", "حل أكبر عدد من العمليات قبل انتهاء الوقت.");

    let time = 30;
    let correct = 0;
    let currentAnswer;

    function next() {
        let a = Math.floor(Math.random() * 20) + 1;
        let b = Math.floor(Math.random() * 20) + 1;
        currentAnswer = a + b;

        area.innerHTML = `
            <div class="game-title">⏱️ الوقت: <span id="timer">${time}</span> ثانية</div>
            <div class="question">${a} + ${b} = ؟</div>
            <div class="center">
                <input id="speedInput" type="number" placeholder="اكتب الإجابة">
                <br>
                <button class="main-btn" onclick="checkSpeed()">تحقق</button>
            </div>
            <div class="message">الإجابات الصحيحة: ${correct}</div>
        `;

        document.getElementById("speedInput").focus();
    }

    window.checkSpeed = function() {
        const input = document.getElementById("speedInput");
        if (!input || input.value === "") return;

        if (Number(input.value) === currentAnswer) correct++;
        next();
    };

    const timer = setInterval(() => {
        time--;
        const el = document.getElementById("timer");
        if (el) el.textContent = time;

        if (time <= 0) {
            clearInterval(timer);
            addPoints(correct * 5);
            finish(`حللت ${correct} عمليات بشكل صحيح!`);
        }
    }, 1000);

    next();
}

/* 3 - خمن الرقم */

function numberGame() {
    setup("🔢 خمن الرقم", "اختر رقماً من 1 إلى 100 وحاول اكتشاف الرقم السري.");

    let secret = Math.floor(Math.random() * 100) + 1;
    let attempts = 0;

    area.innerHTML = `
        <div class="question">🎯 أنا أفكر في رقم من 1 إلى 100</div>
        <div class="center">
            <input id="guessInput" type="number" min="1" max="100" placeholder="اكتب رقمك">
            <br>
            <button class="main-btn" onclick="guessNumber()">خمن الرقم</button>
            <div class="message" id="guessMessage"></div>
            <p id="attempts">المحاولات: 0</p>
        </div>
    `;

    window.guessNumber = function() {
        const input = document.getElementById("guessInput");
        const value = Number(input.value);

        if (!input.value || value < 1 || value > 100) {
            document.getElementById("guessMessage").textContent = "اكتب رقماً بين 1 و100!";
            return;
        }

        attempts++;
        document.getElementById("attempts").textContent = "المحاولات: " + attempts;

        if (value === secret) {
            addPoints(Math.max(10, 100 - attempts * 5));
            finish(`ممتاز! الرقم كان ${secret}.`);
        } else {
            document.getElementById("guessMessage").textContent =
                value > secret ? "⬇️ الرقم أصغر!" : "⬆️ الرقم أكبر!";
            input.value = "";
            input.focus();
        }
    };
}

/* 4 - XO */

function xoGame() {
    setup("❌ XO", "العب ضد الكمبيوتر وحاول الفوز.");

    let board = ["", "", "", "", "", "", "", "", ""];
    let ended = false;

    area.innerHTML = `
        <div class="question">أنت ❌ والكمبيوتر ⭕</div>
        <div class="xo-board" id="xoBoard"></div>
        <div class="message" id="xoMessage">دورك الآن!</div>
    `;

    function render() {
        document.getElementById("xoBoard").innerHTML = board.map((v, i) =>
            `<button class="xo-cell" onclick="xoMove(${i})">${v}</button>`
        ).join("");
    }

    function winner() {
        const lines = [
            [0,1,2],[3,4,5],[6,7,8],
            [0,3,6],[1,4,7],[2,5,8],
            [0,4,8],[2,4,6]
        ];

        for (const line of lines) {
            if (board[line[0]] &&
                board[line[0]] === board[line[1]] &&
                board[line[1]] === board[line[2]]) {
                return board[line[0]];
            }
        }

        return board.every(Boolean) ? "draw" : null;
    }

    function check() {
        const result = winner();

        if (result) {
            ended = true;

            if (result === "❌") {
                addPoints(30);
                document.getElementById("xoMessage").textContent = "🏆 فزت!";
            } else if (result === "⭕") {
                document.getElementById("xoMessage").textContent = "😅 الكمبيوتر فاز!";
            } else {
                addPoints(5);
                document.getElementById("xoMessage").textContent = "🤝 تعادل!";
            }

            setTimeout(() => {
                area.innerHTML += `<div class="center"><button class="main-btn" onclick="xoGame()">العب مجدداً</button></div>`;
            }, 300);

            return true;
        }

        return false;
    }

    window.xoMove = function(i) {
        if (ended || board[i]) return;

        board[i] = "❌";
        render();

        if (check()) return;

        const empty = board.map((v, i) => v ? null : i).filter(v => v !== null);
        if (empty.length) {
            const move = empty[Math.floor(Math.random() * empty.length)];
            board[move] = "⭕";
            render();
            check();
        }
    };

    render();
}

/* 5 - الذاكرة */

function memoryGame() {
    setup("🏆 تحدي الذاكرة", "افتح البطاقات واعثر على الأزواج المتشابهة.");

    const symbols = ["🍎", "🚀", "🎮", "⭐", "👑", "🔥", "💎", "🐱"];
    let cards = [...symbols, ...symbols].sort(() => Math.random() - 0.5);
    let opened = [];
    let matched = 0;
    let locked = false;

    area.innerHTML = `
        <div class="question">اعثر على جميع الأزواج!</div>
        <div class="memory-grid" id="memoryGrid"></div>
        <div class="message" id="memoryMessage">الأزواج: 0 / 8</div>
    `;

    function render() {
        document.getElementById("memoryGrid").innerHTML = cards.map((symbol, i) => `
            <button class="memory-card ${cards[i + 1] === "MATCHED" ? "matched" : ""}"
            onclick="flipCard(${i})" id="card${i}">❔</button>
        `).join("");
    }

    window.flipCard = function(i) {
        if (locked || opened.includes(i)) return;

        const button = document.getElementById("card" + i);
        if (button.classList.contains("matched")) return;

        button.textContent = cards[i];
        button.classList.add("opened");
        opened.push(i);

        if (opened.length === 2) {
            locked = true;
            const [a, b] = opened;

            if (cards[a] === cards[b]) {
                matched++;
                document.getElementById("card" + a).classList.add("matched");
                document.getElementById("card" + b).classList.add("matched");
                opened = [];
                locked = false;

                document.getElementById("memoryMessage").textContent = `الأزواج: ${matched} / 8`;

                if (matched === 8) {
                    addPoints(50);
                    finish("وجدت جميع الأزواج!");
                }
            } else {
                setTimeout(() => {
                    document.getElementById("card" + a).textContent = "❔";
                    document.getElementById("card" + b).textContent = "❔";
                    document.getElementById("card" + a).classList.remove("opened");
                    document.getElementById("card" + b).classList.remove("opened");
                    opened = [];
                    locked = false;
                }, 800);
            }
        }
    };

    render();
}

/* 6 - الحظ */

function luckGame() {
    setup("🎲 عجلة الحظ", "اضغط الزر وشاهد ماذا تخبئ لك الصدفة.");

    const prizes = [
        ["🎉 ربحت 50 نقطة!", 50],
        ["⭐ ربحت 20 نقطة!", 20],
        ["💎 ربحت 100 نقطة!", 100],
        ["😅 لم تربح هذه المرة!", 0],
        ["🔥 ربحت 10 نقاط!", 10],
        ["👑 ربحت 75 نقطة!", 75]
    ];

    area.innerHTML = `
        <div class="center">
            <div style="font-size:90px;margin:20px">🎡</div>
            <h2>هل أنت محظوظ اليوم؟</h2>
            <p class="message" id="luckMessage">اضغط وجرّب حظك!</p>
            <button class="main-btn" id="luckButton" onclick="spinLuck()">لف العجلة</button>
        </div>
    `;

    window.spinLuck = function() {
        const button = document.getElementById("luckButton");
        button.disabled = true;
        button.textContent = "جاري الدوران...";

        setTimeout(() => {
            const prize = prizes[Math.floor(Math.random() * prizes.length)];
            addPoints(prize[1]);
            document.getElementById("luckMessage").textContent = prize[0];
            button.textContent = "جرّب مرة أخرى";
            button.disabled = false;
        }, 1200);
    };
}

/* 7 - من أنا؟ */

function whoGame() {
    setup("🎭 من أنا؟", "اقرأ الوصف وحاول معرفة الشخصية.");

    const people = [
        ["أنا كوكب أحمر، من أنا؟", "المريخ", ["الأرض", "المريخ", "زحل", "عطارد"]],
        ["أنا حيوان ملك الغابة، من أنا؟", "الأسد", ["النمر", "الأسد", "الفهد", "الذئب"]],
        ["أنا أضيء في الليل وأدور حول الأرض، من أنا؟", "القمر", ["الشمس", "القمر", "المريخ", "النجوم"]],
        ["أنا أملك ثمانية أرجل وأصنع الشبكة، من أنا؟", "العنكبوت", ["النحلة", "الفراشة", "العنكبوت", "النملة"]],
        ["أنا أكبر محيط في العالم، من أنا؟", "المحيط الهادئ", ["الأطلسي", "الهندي", "المتجمد", "المحيط الهادئ"]]
    ];

    let index = 0;
    let wins = 0;

    function show() {
        if (index >= people.length) {
            addPoints(wins * 15);
            finish(`عرفت ${wins} شخصيات بشكل صحيح!`);
            return;
        }

        const p = people[index];

        area.innerHTML = `
            <div class="game-title">الشخصية ${index + 1} من ${people.length}</div>
            <div class="question">${p[0]}</div>
            <div class="answers">
                ${p[2].map(x => `<button class="answer" onclick="whoAnswer('${x.replace(/'/g, "\\'")}')">${x}</button>`).join("")}
            </div>
            <div class="message" id="whoMessage"></div>
        `;
    }

    window.whoAnswer = function(choice) {
        const correct = choice === people[index][1];

        if (correct) wins++;

        document.getElementById("whoMessage").textContent =
            correct ? "✅ إجابة صحيحة!" : "❌ الإجابة: " + people[index][1];

        document.querySelectorAll(".answer").forEach(b => b.disabled = true);

        setTimeout(() => {
            index++;
            show();
        }, 1000);
    };

    show();
}

/* 8 - غرفة الرعب */

function horrorGame() {
    setup("👻 غرفة الهروب", "أنت محبوس داخل غرفة. حل الألغاز واخرج منها!");

    let step = 0;

    const puzzles = [
        {
            text: "وجدت باباً عليه رمز. كم يساوي 5 × 5؟",
            answer: "25",
            hint: "خمسة مضروبة في خمسة"
        },
        {
            text: "وجدت ورقة مكتوب عليها: ما الشيء الذي له أسنان ولا يعض؟",
            answer: "المشط",
            hint: "تستخدمه لترتيب الشعر"
        },
        {
            text: "آخر لغز: ما العدد التالي؟ 2، 4، 6، 8، ؟",
            answer: "10",
            hint: "الأعداد تزيد بمقدار 2"
        }
    ];

    function show() {
        if (step >= puzzles.length) {
            addPoints(50);
            finish("🎉 نجحت في الهروب من الغرفة!");
            return;
        }

        area.innerHTML = `
            <div class="center">
                <div style="font-size:75px">👻</div>
                <h2>غرفة الهروب - المرحلة ${step + 1}</h2>
                <div class="question">${puzzles[step].text}</div>
                <input id="horrorInput" placeholder="اكتب الحل">
                <br>
                <button class="main-btn" onclick="checkHorror()">افتح الباب</button>
                <button class="main-btn" onclick="showHint()">تلميح</button>
                <div class="message" id="horrorMessage"></div>
            </div>
        `;
    }

    window.showHint = function() {
        document.getElementById("horrorMessage").textContent = "💡 " + puzzles[step].hint;
    };

    window.checkHorror = function() {
        const value = document.getElementById("horrorInput").value.trim();

        if (value.toLowerCase() === puzzles[step].answer.toLowerCase()) {
            document.getElementById("horrorMessage").textContent = "🔓 الباب انفتح!";
            setTimeout(() => {
                step++;
                show();
            }, 800);
        } else {
            document.getElementById("horrorMessage").textContent = "❌ الحل غير صحيح، حاول مرة أخرى!";
        }
    };

    show();
}

/* 9 - القنبلة */

function bombGame() {
    setup("💣 تحدي القنبلة", "اضغط الزر بسرعة قبل انتهاء العد التنازلي!");

    let time = 10;
    let stopped = false;

    area.innerHTML = `
        <div class="center">
            <div style="font-size:90px" id="bomb">💣</div>
            <h2>انقذ نفسك!</h2>
            <div class="question">الوقت المتبقي: <span id="bombTime">10</span></div>
            <button class="main-btn" onclick="stopBomb()">إيقاف القنبلة!</button>
            <div class="message" id="bombMessage"></div>
        </div>
    `;

    const timer = setInterval(() => {
        if (stopped) {
            clearInterval(timer);
            return;
        }

        time--;
        document.getElementById("bombTime").textContent = time;

        if (time <= 0) {
            clearInterval(timer);
            stopped = true;
            document.getElementById("bomb").textContent = "💥";
            document.getElementById("bombMessage").textContent = "انفجرت القنبلة!";
            setTimeout(() => finish("حاول مرة أخرى وأنقذ نفسك!"), 1000);
        }
    }, 1000);

    window.stopBomb = function() {
        if (stopped) return;

        stopped = true;
        clearInterval(timer);
        addPoints(time * 5 + 10);
        document.getElementById("bomb").textContent = "🛡️";
        document.getElementById("bombMessage").textContent = "🎉 نجحت في إيقاف القنبلة!";
        setTimeout(() => finish("أنقذت نفسك قبل الانفجار!"), 1000);
    };
}

/* 10 - صندوق المفاجآت */

function boxGame() {
    setup("🎁 صندوق المفاجآت", "اختر صندوقاً واحداً واكتشف جائزتك.");

    const prizes = [
        ["💎", "ربحت 100 نقطة!", 100],
        ["⭐", "ربحت 50 نقطة!", 50],
        ["🔥", "ربحت 25 نقطة!", 25],
        ["😅", "للأسف، الصندوق فارغ!", 0],
        ["👑", "ربحت 150 نقطة!", 150],
        ["🎉", "ربحت 75 نقطة!", 75]
    ];

    let used = false;

    area.innerHTML = `
        <div class="question">اختر صندوق المفاجأة 🎁</div>
        <div class="answers" id="boxes">
            ${[1,2,3,4,5,6].map(i => `
                <button class="answer" onclick="openBox(${i})" style="font-size:40px">🎁</button>
            `).join("")}
        </div>
        <div class="message" id="boxMessage"></div>
    `;

    window.openBox = function(i) {
        if (used) return;
        used = true;

        const prize = prizes[Math.floor(Math.random() * prizes.length)];
        addPoints(prize[2]);

        document.getElementById("boxes").innerHTML = `
            <div class="center" style="grid-column:1/-1">
                <div style="font-size:100px">${prize[0]}</div>
                <h2>${prize[1]}</h2>
                <p>اخترت الصندوق رقم ${i}</p>
                <button class="main-btn" onclick="boxGame()">افتح صندوقاً آخر</button>
            </div>
        `;
    };
}

/* تشغيل اللعبة المطلوبة */

const games = {
    quiz: quizGame,
    speed: speedGame,
    number: numberGame,
    xo: xoGame,

    `;
}
