<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZF OFFICIAL | Notifications</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #090711;
    color: white;
    min-height: 100vh;
}

header {
    height: 75px;
    background: #110d20;
    border-bottom: 1px solid #30204b;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 6%;
}

.logo {
    color: #b68aff;
    font-size: 25px;
    font-weight: bold;
}

header a {
    color: white;
    text-decoration: none;
    background: #241638;
    padding: 12px 20px;
    border-radius: 10px;
}

.container {
    width: 92%;
    max-width: 900px;
    margin: 45px auto;
}

.heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    gap: 15px;
}

.heading h1 {
    color: #c39aff;
    font-size: 30px;
}

.heading p {
    color: #888;
    margin-top: 8px;
}

.count {
    background: #7845b8;
    padding: 12px 17px;
    border-radius: 12px;
}

.actions {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.actions button {
    border: none;
    padding: 12px 17px;
    border-radius: 10px;
    cursor: pointer;
    color: white;
    background: #291b3e;
    transition: .2s;
}

.actions button:hover {
    background: #7845b8;
}

.notification {
    background: #151020;
    border: 1px solid #302044;
    border-radius: 15px;
    padding: 19px;
    margin-bottom: 13px;
    display: flex;
    align-items: center;
    gap: 15px;
    animation: show .3s ease;
    transition: .2s;
}

.notification:hover {
    transform: translateY(-3px);
    border-color: #a66ae9;
}

.notification.unread {
    border-right: 4px solid #a66ae9;
    background: #1d1430;
}

.icon {
    width: 48px;
    height: 48px;
    min-width: 48px;
    background: #302044;
    border-radius: 14px;
    display: grid;
    place-items: center;
    font-size: 23px;
}

.info {
    flex: 1;
}

.info h3 {
    color: #d5b8ff;
    font-size: 16px;
    margin-bottom: 6px;
}

.info p {
    color: #aaa;
    font-size: 14px;
}

.info small {
    display: block;
    color: #777;
    margin-top: 8px;
}

.delete {
    background: transparent;
    border: none;
    color: #ff7777;
    cursor: pointer;
    font-size: 18px;
}

.empty {
    text-align: center;
    padding: 80px 15px;
    background: #151020;
    border-radius: 15px;
    color: #888;
}

.empty span {
    font-size: 45px;
    display: block;
    margin-bottom: 15px;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
}

@keyframes show {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media(max-width:600px) {
    .heading {
        align-items: flex-start;
        flex-direction: column;
    }

    .notification {
        padding: 13px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">AZF OFFICIAL</div>
    <a href="index.html">🏠 الرئيسية</a>
</header>

<div class="container">

    <div class="heading">
        <div>
            <h1>🔔 الإشعارات</h1>
            <p>تابع آخر الأخبار والتنبيهات الخاصة بحسابك</p>
        </div>

        <div class="count">
            <span id="unreadCount">0</span> جديد
        </div>
    </div>

    <div class="actions">
        <button onclick="markAllRead()">✓ تحديد الكل كمقروء</button>
        <button onclick="clearAll()">🗑️ حذف الكل</button>
    </div>

    <div id="notificationsList"></div>

</div>

<footer>
    جميع الحقوق محفوظة © أبو عزوز | AZF OFFICIAL
</footer>

<script>
const username =
    sessionStorage.getItem("azf_current_user") || "زائر";

const storageKey = "azf_notifications_" + username;

function getNotifications() {
    return JSON.parse(localStorage.getItem(storageKey) || "[]");
}

function saveNotifications(data) {
    localStorage.setItem(storageKey, JSON.stringify(data));
}

function renderNotifications() {
    const notifications = getNotifications();
    const list = document.getElementById("notificationsList");

    const unread = notifications.filter(n => !n.read).length;

    document.getElementById("unreadCount").textContent = unread;

    list.innerHTML = "";

    if (notifications.length === 0) {
        list.innerHTML = `
            <div class="empty">
                <span>🔕</span>
                <h3>ما عندك إشعارات حتى الآن</h3>
                <p>إذا وصلك شيء جديد راح يظهر هنا</p>
            </div>
        `;
        return;
    }

    notifications.forEach((n,index) => {
        const card = document.createElement("div");

        card.className = "notification" + (!n.read ? " unread" : "");

        const icon = document.createElement("div");
        icon.className = "icon";
        icon.textContent = n.icon || "🔔";

        const info = document.createElement("div");
        info.className = "info";

        const title = document.createElement("h3");
        title.textContent = n.title;

        const message = document.createElement("p");
        message.textContent = n.message;

        const time = document.createElement("small");
        time.textContent = n.time;

        info.append(title,message,time);

        const del = document.createElement("button");
        del.className = "delete";
        del.textContent = "✕";
        del.title = "حذف الإشعار";
        del.onclick = () => deleteNotification(index);

        card.append(icon,info,del);

        card.onclick = (event) => {
            if (event.target === del) return;
            markRead(index);
        };

        list.appendChild(card);
    });
}

function markRead(index) {
    const notifications = getNotifications();

    if (!notifications[index]) return;

    notifications[index].read = true;

    saveNotifications(notifications);
    renderNotifications();
}

function markAllRead() {
    const notifications = getNotifications();

    notifications.forEach(n => n.read = true);

    saveNotifications(notifications);
    renderNotifications();
}

function deleteNotification(index) {
    const notifications = getNotifications();

    notifications.splice(index,1);

    saveNotifications(notifications);
    renderNotifications();
}

function clearAll() {
    if (!confirm("هل تريد حذف جميع الإشعارات؟")) return;

    saveNotifications([]);
    renderNotifications();
}

renderNotifications();

window.addEventListener("storage", (event) => {
    if (event.key === storageKey) {
        renderNotifications();
    }
});
</script>
<script src="analytics.js"></script>
</body>
</html>
